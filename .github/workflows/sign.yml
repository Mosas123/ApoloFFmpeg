name: Sign frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Ad-hoc sign every framework
        run: |
          set -euo pipefail
          find Sources -type d -name '*.framework' -print0 | while IFS= read -r -d '' fw; do
            echo "Signing $fw"
            codesign --force --sign - --timestamp=none "$fw"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Sources
          if git diff --cached --quiet; then
            echo "Nothing to sign"
            exit 0
          fi
          git commit -m "sign: ad-hoc sign patched frameworks"
          git push
