name: Prove Apple FFmpeg dylib relocation

on:
  pull_request:
    branches: [apolo-union]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relocation:
    name: Relocate every imported Apple slice in disposable copies
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Exercise the relocation helper on every XCFramework slice
        run: |
          set -euo pipefail
          # Work on isolated binary copies only, never checked-in frameworks.
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import shutil
          import subprocess
          import os

          output = Path(os.environ["RUNNER_TEMP"]) / "apolo-macho-relocation"
          output.mkdir(parents=True, exist_ok=True)
          tested = 0
          for xcframework in sorted(Path("Sources").glob("Aether*.xcframework")):
              module = xcframework.name.removesuffix(".xcframework")
              with (xcframework / "Info.plist").open("rb") as handle:
                  entries = plistlib.load(handle)["AvailableLibraries"]
              for item in entries:
                  platform = item["SupportedPlatform"]
                  variant = item.get("SupportedPlatformVariant")
                  if platform == "ios":
                      flag = "isimulator" if variant == "simulator" else "ios"
                  elif platform == "tvos":
                      flag = "tvsimulator" if variant == "simulator" else "tvos"
                  elif platform == "xros":
                      flag = "xrsimulator" if variant == "simulator" else "xros"
                  elif platform == "macos":
                      flag = "macos"
                  else:
                      raise RuntimeError(f"unexpected platform {platform}")

                  source = xcframework / item["LibraryIdentifier"] / item["BinaryPath"]
                  target = output / f"{module}-{item['LibraryIdentifier']}"
                  shutil.copy2(source, target)
                  subprocess.run([
                      "python3", "Scripts/relocate-apple-dylibs.py",
                      "--binary", str(target),
                      "--framework-name", module,
                      "--platform", flag,
                  ], check=True)
                  subprocess.run([
                      "codesign", "--force", "--sign", "-",
                      "--timestamp=none", str(target),
                  ], check=True)
                  tested += 1
          assert tested == 63, f"expected 9 x 7 platform slices; got {tested}"
          print(f"PASS: relocated and re-signed {tested} disposable Apple slices")
          PY

      - name: Verify published XCFrameworks and build provenance unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- Sources/
          git diff --exit-code -- BUILD-INFO.txt
