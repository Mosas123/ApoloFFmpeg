name: Build ApoloFFmpeg (staged, validated)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apolo-ffmpeg-staged-build
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild Apple XCFrameworks and publish a review branch
    runs-on: macos-15-intel
    timeout-minutes: 350
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config meson ninja nasm

      - name: Toolchain identity
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Rebuild frameworks from pinned upstream and current patches
        run: ./build.sh

      - name: Verify build record and shipped XCFramework metadata
        run: |
          # This gate runs on freshly rebuilt outputs (never on stale checked-in binaries).
          # Do not publish a review branch if bundle minimums exceed SwiftPM floors.
          python3 Scripts/validate-apolo-baseline.py \
            --strict-deployment \
            --report-json apolo-baseline.json

      - name: Verify macOS framework dynamic linkage
        run: |
          python3 Scripts/validate-macho-links.py \
            --platform macos \
            --report-json macos-linkage.json

      - name: Resolve and compile rebuilt iOS Simulator package
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme AetherFFmpegBuild \
            -destination 'generic/platform=iOS Simulator'
          xcodebuild build \
            -scheme AetherFFmpegBuild \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ApoloStaged \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO

      - name: Run original macOS regression suite on rebuilt frameworks
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme FFmpegBuild-Package \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ApoloStaged \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300

      - name: Store small audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apolo-ffmpeg-rebuild-validation
          path: |
            apolo-baseline.json
            macos-linkage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish validated binaries only to a review branch
        env:
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Deliberately don't push rebuilt frameworks onto apolo-union/main.
          # This job creates a reviewable branch after *every gate* above
          # has passed. A separate human-reviewed PR and iPhone QA are required.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Sources BUILD-INFO.txt
          if git diff --cached --quiet; then
            echo "No binary/provenance change to stage"
            exit 0
          fi
          BRANCH="build/apolo-ffmpeg-${RUN_NUMBER}"
          git switch -c "$BRANCH"
          git commit -m "build: rebuilt ApoloFFmpeg xcframeworks and matching provenance"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Review branch: $BRANCH"
          echo "Never merge it before binary/feature CI and physical device QA"
